name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: pytest (solver, accounting, units.js, blob-sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy scipy pandas pytest
      # The node harnesses run via pytest; canon_flows.cjs needs jsdom to parse the app's
      # innerHTML-built collections, so node deps must be present in THIS job too.
      - name: Install node deps
        run: npm install --no-audit --no-fund
      - name: Run pytest
        # Includes: solver regression, accounting identities, the units.js self-test
        # (runs via node), and the blob-sync guard (embedded solver == disk).
        run: pytest -q

  typecheck:
    name: tsc (worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install node deps
        run: npm install --no-audit --no-fund
      - name: Typecheck worker
        run: npx tsc --noEmit
